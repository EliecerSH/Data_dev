name: Deploy to EC2 with Docker Compose

on:
  push:
    branches:
      - deploy

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: mi-app-repo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS Academy
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Iniciar sesión en AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir y subir imagen a AWS ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Detecta si el directorio es ./Data o ./data
          PATH_IMAGE=$(test -d ./Data/image-server && echo "./Data/image-server" || echo "./data/image-server")
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest $PATH_IMAGE
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Transferir docker-compose.yml y desplegar vía AWS SSM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Localizar el archivo docker-compose.yml
          COMPOSE_FILE=$(test -f ./Data/docker-compose.yml && echo "./Data/docker-compose.yml" || echo "./data/docker-compose.yml")
          COMPOSE_BASE64=$(base64 -w 0 $COMPOSE_FILE)

          # Enviar comandos de despliegue remotos usando SSM
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region '${{ env.AWS_REGION }}' | docker login --username AWS --password-stdin '${{ env.ECR_REGISTRY }}'",
              "mkdir -p /home/ec2-user/app",
              "echo '\'${COMPOSE_BASE64}'\' | base64 -d > /home/ec2-user/app/docker-compose.yml",
              "cd /home/ec2-user/app",
              "export ECR_IMAGE='${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}':latest",
              "export DB_HOST=\"'${{ secrets.DB_HOST }}'\"",
              "export DB_PASS=\"'${{ secrets.DB_PASS }}'\"",
              "docker compose pull",
              "docker compose down || true",
              "docker compose up -d"
            ]' \
            --region ${{ env.AWS_REGION }} \
            --query "Command.CommandId" \
            --output text)

          echo "Comando SSM enviado con ID: $COMMAND_ID"

          # Esperar la confirmación de ejecución
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region ${{ env.AWS_REGION }}